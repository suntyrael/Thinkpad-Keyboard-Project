name: Code Lint & Quality Check

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only: the style job now *checks* formatting instead of rewriting and
# auto-committing source files (review 2026-08-13 item 2.6).
permissions:
  contents: read

jobs:
  style-check:
    name: Code Style & Encoding Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install clang-format
      - name: Install Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install clang-format-15 -y

      # 2. Verify C/C++ files match the repository .clang-format.
      #    Fail loudly instead of rewriting and auto-committing (the old
      #    behavior produced noisy "style:" commits on every push and broke
      #    on fork PRs where GITHUB_TOKEN is read-only).
      - name: Check C/C++ Formatting
        run: |
          clang-format-15 --dry-run --Werror \
            $(find module -type f \( -name "*.c" -o -name "*.h" \))

      # 3. Check file encoding (UTF-8 without BOM) and line endings (LF)
      - name: Check Line Endings & UTF-8 without BOM
        run: |
          errors=0
          files=$(find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.dts" -o -name "*.dtsi" -o -name "*.yaml" -o -name "*.yml" -o -name "Kconfig" -o -name "*_defconfig" -o -name "*.conf" \) -not -path "*/.git/*")
          for file in $files; do
            if file "$file" | grep -q "BOM"; then
              echo "::error file=$file::File contains a Byte Order Mark (BOM)."
              errors=$((errors+1))
            fi
            if file "$file" | grep -q "CRLF"; then
              echo "::error file=$file::File has CRLF line endings instead of LF."
              errors=$((errors+1))
            fi
          done
          if [ $errors -ne 0 ]; then
            echo "$errors formatting error(s) found."
            exit 1
          fi

  static-analysis:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get install cppcheck -y

      - name: Run Cppcheck
        run: |
          # Suppress missingIncludeSystem warning to prevent failing on Zephyr system headers
          cppcheck --enable=warning,portability --suppress=missingIncludeSystem --error-exitcode=1 module/
