name: Release ZMK Firmware

on:
  push:
    tags:
      - 'v*' # Triggers when you push any version tag like v1.1, v1.0.0

permissions:
  contents: write

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      # Publish Intel HEX (no UF2 support on this board): the upstream workflow
      # falls back to this format when no zmk.uf2 is produced.
      fallback_binary: hex

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts
      - name: Create Full Image
        run: |
          python3 tools/merge_hex.py \
            artifacts/thinkpad_full_0x0000.hex \
            firmware/adafruit_bootloader_zmk.hex \
            artifacts/thinkpad_wireless-zmk.hex

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.hex
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}