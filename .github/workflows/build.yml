name: Build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "module/**"
      - "tools/**"
      - "zephyr/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "module/**"
      - "tools/**"
      - "zephyr/**"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      # Publish Intel HEX (no UF2 support on this board): the upstream workflow
      # falls back to this format when no zmk.uf2 is produced.
      fallback_binary: hex

  # Generate a full flash image (bootloader + application) for one-step flashing
  create-full-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download App Firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      # Fail early with a clear message if the upstream build artifact or its
      # naming changed, instead of silently producing a broken image
      # (review 2026-08-13 item 2.12).
      - name: Verify Artifacts Present
        run: |
          test -f fw/thinkpad_wireless-zmk.hex || { echo "::error::Expected artifact fw/thinkpad_wireless-zmk.hex not found; upstream workflow may have changed its artifact layout."; exit 1; }
          test -f firmware/adafruit_bootloader_zmk.hex || { echo "::error::Bootloader firmware/adafruit_bootloader_zmk.hex missing from repo."; exit 1; }
      - name: Merge Bootloader + Application
        run: |
          python3 tools/merge_hex.py \
            fw/thinkpad_full_0x0000.hex \
            firmware/adafruit_bootloader_zmk.hex \
            fw/thinkpad_wireless-zmk.hex \
            --mark-app-valid
      - name: Upload Full Image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-full
          path: fw/thinkpad_full_0x0000.hex