name: Build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "module/**"
      - "zephyr/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "module/**"
      - "zephyr/**"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      # Publish Intel HEX (no UF2 support on this board): the upstream workflow
      # falls back to this format when no zmk.uf2 is produced.
      fallback_binary: hex