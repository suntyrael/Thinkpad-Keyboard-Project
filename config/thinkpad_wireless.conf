# thinkpad_wireless.conf: User-level configuration for the Thinkpad Wireless keyboard.
# Edit this file to customize ZMK features and settings.
# Hardware-level defaults are in module/boards/thinkpad/thinkpad_wireless/thinkpad_wireless_defconfig.

# ----- Bluetooth -----
CONFIG_ZMK_BLE=y
CONFIG_ZMK_KEYBOARD_NAME="ThinkpadWireless"

# ----- Power Management -----
CONFIG_ZMK_SLEEP=y
# Idle -> Deep Sleep after 15 minutes (900,000 ms) of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Enable poweroff subsystem for deep sleep
CONFIG_POWEROFF=y

# ----- External Power Control (5V Boost for TrackPoint) -----
CONFIG_ZMK_EXT_POWER=y

# ----- Battery -----
CONFIG_ZMK_BATTERY_REPORTING=y
# Report battery level every 10 s (requirement: check every 10 s; ZMK default
# is 60 s, which would delay the low-battery shutdown by up to a minute -
# review 2026-08-13 item 3.4)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10

# ----- TrackPoint (PS/2 Mouse) -----
CONFIG_ZMK_POINTING=y
CONFIG_PS2_GPIO_INTERRUPT_LOG_ENABLED=n

# ----- Keyboard Matrix & Debouncing -----
# 1ms press debounce (robust fast response) + 5ms release filter (chatter immunity)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Membrane matrix RC capacitance settling time (5 us wait before reading sense inputs)
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=5

# ----- Bluetooth Latency & HID Queue Tuning -----
# Deepen BLE keyboard report queue to prevent dropped release reports under pointer activity
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40

# ----- Clocks -----
# LFCLK source: internal RC oscillator (32.768 kHz), NOT the XTAL.
#
# The board schematic (BMD 340SCH) has an external 32.768 kHz crystal X1
# (FC-135R), but bench/current hardware has it unsoldered. The Zephyr nRF
# default is CLOCK_CONTROL_NRF_K32SRC_XTAL: with no crystal fitted, LFCLK
# never starts, the kernel tick (RTC on LFCLK) never runs and the app hangs
# in the clock driver at boot (no USB, no BLE). The internal RC avoids the
# dependency entirely; BLE RF timing still uses the 32 MHz XTAL inside the
# BMD-340 module. Solder X1 and restore XTAL (delete this option) if you
# want the external-crystal path back.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ----- USB HID (wired mode; VID:PID 0x1D50:0x615E from ZMK defaults) -----
CONFIG_ZMK_USB=y

# ----- ZMK Studio (visual keymap editor; BLE GATT transport auto-enabled) -----
CONFIG_ZMK_STUDIO=y

# ----- HID Indicators (Caps Lock LED) -----
CONFIG_ZMK_HID_INDICATORS=y


# ----- Logging -----
# NOTE: this ZMK version has no working user-facing knob to lower the zmk
# log level (ZMK_LOG_LEVEL_WRN is a no-op, CONFIG_ZMK_LOG_LEVEL is read-only,
# ZMK_LOGGING_MINIMAL is dead). The zmk_usb_get_conn_state DBG flood is
# silenced by patching zmk/app/src/usb.c instead (see that file).

# ----- TrackPoint transmission error mitigation -----
# Discard packets with overflow bits or implausible movement deltas instead
# of letting corrupted frames reach HID as cursor jumps (seen during fast
# pointer motion with occasional parity/stop-bit read errors).
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_ERROR_MITIGATION=y

# ----- BLE pointer-mode connection parameters -----
# Defaults (MIN 7.5ms / MAX 15ms / LATENCY 30) let the central park the
# peripheral for up to ~450 ms between exchanges once traffic quiets down -
# invisible for keyboards, but clearly visible as pointer stutter over BLE
# (USB unaffected). Fix a short interval and near-zero latency while moving.
# MAX 6 (fixed 7.5ms) doubled the radio-event rate and made PS/2 clock-edge
# loss WORSE (each LL event preempts the CPU for ms-scale windows). Allow the
# central to settle at 15ms - half the radio load - while low latency keeps
# wake-up delay bounded.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
# Match the deepened keyboard queue so fast pointer motion cannot drop reports
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40
