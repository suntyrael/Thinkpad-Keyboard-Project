# thinkpad_wireless.conf: User-level configuration for the Thinkpad Wireless keyboard.
# Edit this file to customize ZMK features and settings.
# Hardware-level defaults are in module/boards/thinkpad/thinkpad_wireless/thinkpad_wireless_defconfig.

# ----- Bluetooth -----
CONFIG_ZMK_BLE=y
CONFIG_ZMK_KEYBOARD_NAME="ThinkpadWireless"

# ----- Power Management -----
CONFIG_ZMK_SLEEP=y
# Idle -> Deep Sleep after 15 minutes (900,000 ms) of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Enable poweroff subsystem for deep sleep
CONFIG_POWEROFF=y

# ----- External Power Control (5V Boost for TrackPoint) -----
CONFIG_ZMK_EXT_POWER=y

# ----- Battery -----
CONFIG_ZMK_BATTERY_REPORTING=y
# Report battery level every 10 s (requirement: check every 10 s; ZMK default
# is 60 s, which would delay the low-battery shutdown by up to a minute -
# review 2026-08-13 item 3.4)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10

# ----- TrackPoint (PS/2 Mouse) -----
CONFIG_ZMK_POINTING=y
# Print every PS/2 SCL edge with scl/sda level + position to the serial log.
# Bring-up debug for the write-path "scl timeout at pos=1" failure: it tells
# us whether the device never clocks (electrical/host-side) or clocks but the
# driver misses it (interrupt/software). Disable once bring-up is done.
CONFIG_PS2_GPIO_INTERRUPT_LOG_ENABLED=y

# ----- USB HID (wired mode; VID:PID 0x1D50:0x615E from ZMK defaults) -----
CONFIG_ZMK_USB=y

# ----- ZMK Studio (visual keymap editor; BLE GATT transport auto-enabled) -----
CONFIG_ZMK_STUDIO=y

# ----- HID Indicators (Caps Lock LED) -----
CONFIG_ZMK_HID_INDICATORS=y


# ----- Logging -----
# NOTE: this ZMK version has no working user-facing knob to lower the zmk
# log level (ZMK_LOG_LEVEL_WRN is a no-op, CONFIG_ZMK_LOG_LEVEL is read-only,
# ZMK_LOGGING_MINIMAL is dead). The zmk_usb_get_conn_state DBG flood is
# silenced by patching zmk/app/src/usb.c instead (see that file).
